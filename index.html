<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYORA Social</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://bquuaxzsjtiycqbzrmtn.supabase.co';
    sb_publishable_rOljy0MN3Uvbb-0KYR181Q_Sm2-HHnQ
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [posts, setPosts] = React.useState([]);
      const [newText, setNewText] = React.useState('');
      const [newImage, setNewImage] = React.useState('');
      const [loading, setLoading] = React.useState(true);
      const [posting, setPosting] = React.useState(false);

      const fetchPosts = async () => {
        const { data, error } = await supabase
          .from('posts')
          .select('*')
          .order('created_at', { ascending: false });

        if (!error) setPosts(data || []);
        setLoading(false);
      };

      React.useEffect(() => {
        fetchPosts();
      }, []);

      const handleLike = async (id, currentLikes) => {
        const newLikes = (currentLikes || 0) + 1;
        setPosts(posts.map(p => p.id === id ? { ...p, likes: newLikes } : p));
        await supabase.from('posts').update({ likes: newLikes }).eq('id', id);
      };

      // Compressed Image Handler
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const img = new Image();
          img.src = URL.createObjectURL(file);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 500;
            const scaleFactor = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleFactor;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            setNewImage(canvas.toDataURL('image/jpeg', 0.6));
          };
        }
      };

      const handleCreatePost = async (e) => {
        e.preventDefault();
        if (!newText.trim() && !newImage) return;

        setPosting(true);
        const newPostData = {
          user_name: 'You',
          user_handle: '@user',
          caption: newText,
          image_url: newImage,
          likes: 0
        };

        const { data, error } = await supabase
          .from('posts')
          .insert([newPostData])
          .select();

        setPosting(false);

        if (error) {
          alert('Error: ' + error.message);
        } else if (data) {
          setPosts([data[0], ...posts]);
          setNewText('');
          setNewImage('');
        }
      };

      return (
        <div class="max-w-md mx-auto min-h-screen p-4 flex flex-col justify-between">
          <div>
            <header class="flex justify-between items-center py-4 border-b border-gray-800">
              <h1 class="text-2xl font-bold text-teal-400">VYORA</h1>
              <span class="text-xs bg-gray-800 px-3 py-1 rounded-full text-gray-400">Night mode</span>
            </header>

            <form onSubmit={handleCreatePost} class="my-4 p-3 bg-gray-800 rounded-xl border border-gray-700">
              <textarea
                class="w-full bg-gray-900 text-sm text-white p-2 rounded-lg focus:outline-none border border-gray-700"
                placeholder="What's happening?"
                rows="2"
                value={newText}
                onChange={(e) => setNewText(e.target.value)}
              ></textarea>
              
              {newImage && (
                <img src={newImage} alt="Preview" class="w-full h-40 object-cover rounded-lg my-2" />
              )}

              <div class="flex justify-between items-center mt-2">
                <label class="cursor-pointer text-xs text-teal-400 bg-gray-900 px-3 py-2 rounded-lg border border-gray-700">
                  📷 Add Photo
                  <input type="file" accept="image/*" class="hidden" onChange={handleImageUpload} />
                </label>
                <button type="submit" disabled={posting} class="bg-teal-500 text-black font-semibold text-xs px-4 py-2 rounded-lg disabled:opacity-50">
                  {posting ? 'Posting...' : 'Post'}
                </button>
              </div>
            </form>

            <main>
              <h2 class="text-xl font-semibold mb-4 text-gray-200">Vibe feed</h2>
              
              {loading ? (
                <p class="text-center text-gray-500 text-sm">Loading posts...</p>
              ) : posts.length === 0 ? (
                <p class="text-center text-gray-500 text-sm">No posts yet. Create the first one!</p>
              ) : (
                <div class="space-y-4">
                  {posts.map(post => (
                    <div key={post.id} class="p-4 bg-gray-800 rounded-xl border border-gray-700">
                      <div class="flex items-center space-x-3 mb-2">
                        <div class="w-8 h-8 rounded-full bg-teal-500 flex items-center justify-center font-bold text-sm text-black">
                          {post.user_name ? post.user_name[0] : 'U'}
                        </div>
                        <div>
                          <p class="font-medium text-sm">{post.user_name}</p>
                          <p class="text-xs text-gray-400">{post.user_handle}</p>
                        </div>
                      </div>
                      {post.caption && <p class="text-sm my-2 text-gray-300">{post.caption}</p>}
                      {post.image_url && (
                        <img src={post.image_url} alt="Post content" class="w-full h-48 object-cover rounded-lg my-2" />
                      )}
                      <div class="flex space-x-4 text-xs mt-3">
                        <button 
                          onClick={() => handleLike(post.id, post.likes)}
                          class="flex items-center space-x-1 text-gray-400 hover:text-red-500"
                        >
                          <span>❤️</span>
                          <span>{post.likes || 0}</span>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          </div>

          <footer class="flex justify-around py-3 bg-gray-800 border-t border-gray-700 rounded-t-xl mt-6">
            <button class="text-teal-400 text-sm font-medium">Discover</button>
            <button class="text-gray-400 text-sm font-medium">Circles</button>
            <button class="text-gray-400 text-sm font-medium">Messages</button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
