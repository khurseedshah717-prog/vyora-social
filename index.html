<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Instagram Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-nav { background: rgba(10, 10, 12, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); }
    .glass-header { background: rgba(10, 10, 12, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="select-none" onload="initApp()">

  <div class="max-w-md mx-auto h-full flex flex-col bg-black text-white relative border-x border-zinc-900 shadow-2xl">

    <!-- Header -->
    <header class="h-14 glass-header flex items-center justify-between px-4 flex-shrink-0 z-30">
      <h1 class="text-2xl font-black tracking-widest bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 bg-clip-text text-transparent italic">Instagram Pro</h1>
      <button onclick="showToast('No new notifications')" class="text-xl"><i class="far fa-bell"></i></button>
    </header>

    <!-- Toast Notification -->
    <div id="toast" class="hidden absolute top-16 left-1/2 -translate-x-1/2 z-50 bg-zinc-900 border border-pink-500/40 px-4 py-2 rounded-full text-xs font-semibold text-pink-300 shadow-xl"></div>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto hide-scrollbar relative pb-20">
      
      <!-- Feed Tab -->
      <div id="tab-feed" class="tab-content">
        <!-- Stories Section -->
        <div class="p-3 bg-zinc-950/80 border-b border-zinc-900 overflow-x-auto hide-scrollbar flex space-x-4 items-center" id="stories-bar">
          <label class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer">
            <div class="relative w-14 h-14 rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600">
              <img id="my-story-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" class="w-full h-full rounded-full object-cover border-2 border-black" />
              <span class="absolute bottom-0 right-0 bg-cyan-400 text-black rounded-full w-4 h-4 flex items-center justify-center text-[10px] font-black border border-black">+</span>
            </div>
            <span class="text-[10px] text-zinc-300">Your Story</span>
            <input type="file" accept="image/*" class="hidden" onchange="uploadStory(event)" />
          </label>
          <div id="user-stories-list" class="flex space-x-3"></div>
        </div>

        <!-- Posts Area -->
        <div id="posts-container" class="divide-y divide-zinc-900"></div>
      </div>

      <!-- Profile Tab -->
      <div id="tab-profile" class="tab-content hidden p-4 space-y-6">
        <div class="flex items-center space-x-4">
          <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-yellow-400 to-pink-600 p-1">
            <div class="w-full h-full bg-black rounded-full flex items-center justify-center font-bold text-xl text-pink-500" id="prof-initial">M</div>
          </div>
          <div class="flex-1">
            <h2 class="font-bold text-sm" id="prof-name">My Instagram Account</h2>
            <p class="text-xs text-zinc-400" id="prof-bio">Digital Creator | Saved Forever ✨</p>
          </div>
        </div>

        <!-- Edit Profile Box -->
        <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-900 space-y-3">
          <p class="text-xs font-bold text-pink-400">Edit Profile Details</p>
          <input type="text" id="input-edit-name" placeholder="Enter your name..." class="w-full bg-zinc-900 text-xs p-2.5 rounded-lg text-white focus:outline-none" />
          <input type="text" id="input-edit-bio" placeholder="Enter your bio..." class="w-full bg-zinc-900 text-xs p-2.5 rounded-lg text-white focus:outline-none" />
          <button onclick="updateProfile()" class="w-full bg-gradient-to-r from-pink-500 to-cyan-400 text-black py-2 rounded-lg text-xs font-bold">Save Profile</button>
        </div>

        <button onclick="clearAllData()" class="w-full bg-red-600/20 text-red-400 border border-red-600/40 py-2.5 rounded-lg text-xs font-bold">Reset / Clear Posts</button>
      </div>

      <!-- Upload Screen Modal -->
      <div id="upload-screen" class="hidden absolute inset-0 bg-black z-50 p-4 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center border-b border-zinc-900 pb-3">
            <button onclick="closeUpload()" class="text-xs text-zinc-400">Cancel</button>
            <span class="text-xs font-bold text-pink-400">Create New Post</span>
            <button onclick="saveNewPost()" class="text-xs font-bold text-cyan-400">Share</button>
          </div>
          <div class="mt-4 flex space-x-3">
            <img id="preview-img" class="w-24 h-28 object-cover rounded-lg border border-zinc-800" />
            <textarea id="post-caption" placeholder="Write a caption..." class="w-full bg-zinc-900 text-xs p-3 rounded-lg text-white focus:outline-none resize-none h-28"></textarea>
          </div>
          <div class="mt-4 space-y-2">
            <label class="text-xs font-bold text-pink-300"><i class="fas fa-music"></i> Select Song / Music</label>
            <select id="post-song" class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white p-2.5 rounded-lg focus:outline-none">
              <option value="🎵 Arijit Singh - Romantic Melody">🎵 Arijit Singh - Romantic Melody</option>
              <option value="🎵 AP Dhillon - Punjabi Vibe">🎵 AP Dhillon - Punjabi Vibe</option>
              <option value="🎵 Anirudh - Mass Beat">🎵 Anirudh - Mass Beat</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Comments Modal -->
      <div id="comments-modal" class="hidden absolute inset-0 bg-black/95 z-50 flex flex-col p-4">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
          <span class="text-xs font-bold text-pink-400">Comments</span>
          <button onclick="closeComments()" class="text-xs text-zinc-400">Close</button>
        </div>
        <div id="comments-list" class="flex-1 overflow-y-auto my-3 space-y-2 text-xs"></div>
        <div class="flex space-x-2">
          <input id="comment-input" type="text" placeholder="Add a comment..." class="flex-1 bg-zinc-900 text-xs px-3 py-2 rounded-lg text-white focus:outline-none" />
          <button onclick="addComment()" class="bg-pink-500 text-black font-bold px-3 text-xs rounded-lg">Post</button>
        </div>
      </div>

      <!-- Story Viewer Modal -->
      <div id="story-viewer" class="hidden absolute inset-0 bg-black z-50 flex flex-col justify-between p-4">
        <div class="flex justify-between items-center z-10">
          <span id="story-author" class="text-xs font-bold text-pink-400">Story</span>
          <button onclick="closeStoryView()" class="text-white font-bold text-base">✕</button>
        </div>
        <div class="flex-1 flex items-center justify-center">
          <img id="story-view-img" src="" class="max-h-[80vh] object-contain rounded-lg" />
        </div>
      </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="h-14 glass-nav flex justify-around items-center z-40 text-xl absolute bottom-0 left-0 right-0 max-w-md mx-auto">
      <button onclick="switchTab('feed')" class="text-pink-500"><i class="fas fa-home"></i></button>
      
      <label class="cursor-pointer bg-gradient-to-tr from-pink-500 to-cyan-400 w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-lg">
        <i class="fas fa-plus text-sm"></i>
        <input type="file" accept="image/*" class="hidden" onchange="handleImageSelection(event)" />
      </label>

      <button onclick="switchTab('profile')" class="text-zinc-400"><i class="far fa-user"></i></button>
    </nav>

  </div>

  <script>
    let selectedImageBase64 = "";
    let activePostIdForComment = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2000);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + tab).classList.remove('hidden');
      if(tab === 'profile') loadProfileData();
    }

    function initApp() {
      renderPosts();
      loadProfileData();
      renderStories();
    }

    function getProfile() {
      const p = localStorage.getItem('insta_profile');
      return p ? JSON.parse(p) : { name: "My Instagram Account", bio: "Digital Creator | Saved Forever ✨" };
    }

    function loadProfileData() {
      const prof = getProfile();
      document.getElementById('prof-name').innerText = prof.name;
      document.getElementById('prof-bio').innerText = prof.bio;
      document.getElementById('prof-initial').innerText = prof.name[0].toUpperCase();
      document.getElementById('input-edit-name').value = prof.name;
      document.getElementById('input-edit-bio').value = prof.bio;
    }

    function updateProfile() {
      const name = document.getElementById('input-edit-name').value;
      const bio = document.getElementById('input-edit-bio').value;
      const prof = { name: name || "My Account", bio: bio || "" };
      localStorage.setItem('insta_profile', JSON.stringify(prof));
      loadProfileData();
      showToast("✅ Profile updated!");
    }

    function getPosts() {
      const data = localStorage.getItem('insta_pro_db');
      if (data) return JSON.parse(data);
      return [];
    }

    function savePosts(posts) {
      localStorage.setItem('insta_pro_db', JSON.stringify(posts));
    }

    function renderPosts() {
      const posts = getPosts();
      const container = document.getElementById('posts-container');
      container.innerHTML = "";

      posts.forEach(p => {
        const commentsCount = p.comments ? p.comments.length : 0;
        const div = document.createElement('div');
        div.className = "bg-black pb-4";
        div.innerHTML = `
          <div class="flex items-center justify-between px-3 py-2.5">
            <div class="flex items-center space-x-2">
              <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 to-cyan-400 flex items-center justify-center text-xs font-bold">${p.user[0]}</div>
              <span class="text-xs font-bold">${p.user}</span>
            </div>
            <button onclick="deleteSinglePost(${p.id})" class="text-zinc-600 hover:text-red-500 text-xs"><i class="fas fa-trash"></i></button>
          </div>
          <div class="bg-zinc-950 flex items-center justify-center max-h-[450px] overflow-hidden">
            <img src="${p.image}" class="w-full object-cover max-h-[450px]" />
          </div>
          <div class="flex justify-between px-4 py-3 text-xl">
            <div class="flex space-x-4">
              <button onclick="toggleLike(${p.id})"><i class="far fa-heart text-pink-500" id="heart-${p.id}"></i></button>
              <button onclick="openComments(${p.id})"><i class="far fa-comment text-cyan-400"></i></button>
            </div>
          </div>
          <div class="px-4 text-xs space-y-1">
            <p class="font-bold" id="like-count-${p.id}">${p.likes} likes</p>
            <p><span class="font-bold mr-2">${p.user}</span>${p.caption}</p>
            <p onclick="openComments(${p.id})" class="text-zinc-500 cursor-pointer text-[11px] pt-1">View all ${commentsCount} comments</p>
            <div class="flex items-center space-x-1 text-[10px] text-pink-400 pt-1">
              <i class="fas fa-music animate-pulse"></i>
              <span>${p.song}</span>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function handleImageSelection(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        selectedImageBase64 = event.target.result;
        document.getElementById('preview-img').src = selectedImageBase64;
        document.getElementById('upload-screen').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function closeUpload() {
      document.getElementById('upload-screen').classList.add('hidden');
    }

    function saveNewPost() {
      const caption = document.getElementById('post-caption').value;
      const song = document.getElementById('post-song').value;
      const prof = getProfile();

      const newPost = {
        id: Date.now(),
        user: prof.name,
        image: selectedImageBase64,
        caption: caption || "My new post ✨",
        song: song,
        likes: 1,
        comments: []
      };

      const posts = getPosts();
      posts.unshift(newPost);
      savePosts(posts);

      closeUpload();
      document.getElementById('post-caption').value = "";
      renderPosts();
      switchTab('feed');
      showToast("🚀 Post saved permanently!");
    }

    function deleteSinglePost(id) {
      let posts = getPosts();
      posts = posts.filter(p => p.id !== id);
      savePosts(posts);
      renderPosts();
      showToast("🗑️ Post deleted.");
    }

    function toggleLike(id) {
      const heart = document.getElementById(`heart-${id}`);
      const countEl = document.getElementById(`like-count-${id}`);
      let posts = getPosts();
      posts = posts.map(p => {
        if(p.id === id) {
          if(heart.classList.contains('far')) {
            heart.className = 'fas fa-heart text-pink-500';
            p.likes += 1;
            showToast("❤️ Liked!");
          } else {
            heart.className = 'far fa-heart text-pink-500';
            p.likes -= 1;
          }
          countEl.innerText = p.likes + " likes";
        }
        return p;
      });
      savePosts(posts);
    }

    function openComments(id) {
      activePostIdForComment = id;
      const posts = getPosts();
      const post = posts.find(p => p.id === id);
      const list = document.getElementById('comments-list');
      list.innerHTML = "";
      
      if(post && post.comments) {
        post.comments.forEach(c => {
          const d = document.createElement('div');
          d.className = "bg-zinc-900 p-2 rounded border border-zinc-800";
          d.innerHTML = `<span class="font-bold text-pink-400 mr-2">${c.user}:</span><span>${c.text}</span>`;
          list.appendChild(d);
        });
      }
      document.getElementById('comments-modal').classList.remove('hidden');
    }

    function closeComments() {
      document.getElementById('comments-modal').classList.add('hidden');
    }

    function addComment() {
      const input = document.getElementById('comment-input');
      if(!input.value.trim() || !activePostIdForComment) return;
      const prof = getProfile();
      let posts = getPosts();
      
      posts = posts.map(p => {
        if(p.id === activePostIdForComment) {
          if(!p.comments) p.comments = [];
          p.comments.push({ user: prof.name, text: input.value });
        }
        return p;
      });
      
      savePosts(posts);
      input.value = "";
      openComments(activePostIdForComment);
      renderPosts();
      showToast("💬 Comment added!");
    }

    function uploadStory(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const stories = JSON.parse(localStorage.getItem('insta_stories') || '[]');
        const prof = getProfile();
        stories.unshift({ user: prof.name, img: evt.target.result });
        localStorage.setItem('insta_stories', JSON.stringify(stories));
        renderStories();
        showToast("🌟 Story posted!");
      };
      reader.readAsDataURL(file);
    }

    function renderStories() {
      const stories = JSON.parse(localStorage.getItem('insta_stories') || '[]');
      const container = document.getElementById('user-stories-list');
      container.innerHTML = "";
      stories.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = "flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer";
        div.onclick = () => showStoryView(s.user, s.img);
        div.innerHTML = `
          <div class="w-14 h-14 rounded-full p-[2px] bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-400">
            <img src="${s.img}" class="w-full h-full rounded-full object-cover border-2 border-black" />
          </div>
          <span class="text-[10px] text-zinc-300">${s.user.substring(0, 8)}</span>
        `;
        container.appendChild(div);
      });
    }

    function showStoryView(user, img) {
      document.getElementById('story-author').innerText = user + "'s Story";
      document.getElementById('story-view-img').src = img;
      document.getElementById('story-viewer').classList.remove('hidden');
    }

    function closeStoryView() {
      document.getElementById('story-viewer').classList.add('hidden');
    }

    function clearAllData() {
      if (confirm("Reset all stored app data?")) {
        localStorage.removeItem('insta_pro_db');
        localStorage.removeItem('insta_stories');
        renderPosts();
        renderStories();
        showToast("🔄 Data reset!");
      }
    }
  </script>
</body>
</html>
