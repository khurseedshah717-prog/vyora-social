<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VYORA - Social Platform</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    html, body { height: 100%; margin: 0; background-color: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .glass-nav { background: rgba(10, 10, 12, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-top: 1px solid rgba(255, 255, 255, 0.12); }
    .glass-header { background: rgba(10, 10, 12, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(20px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    .toast-anim { animation: fadeInOut 2.2s ease-in-out forwards; }
  </style>
</head>
<body class="select-none">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    function App() {
      const [posts, setPosts] = React.useState(() => {
        const saved = localStorage.getItem('vyora_posts_v4');
        return saved ? JSON.parse(saved) : [
          {
            id: 1,
            user_name: 'Ayesha_VIP',
            caption: 'Happy birthday my dear bachu my patato my cutie pie 🥰🥰🥰 god bless you i love you so much 🥰🥰🥰',
            image_url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=80',
            likes: 142
          }
        ];
      });

      const [stories, setStories] = React.useState([
        { id: 1, user: 'Your Story', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300', isMe: true },
        { id: 2, user: 'Ayesha_VIP', img: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300' },
        { id: 3, user: 'Rahul_Pro', img: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=300' },
        { id: 4, user: 'Creative_Hub', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300' }
      ]);

      const [commentsMap, setCommentsMap] = React.useState(() => {
        const saved = localStorage.getItem('vyora_comments_v4');
        return saved ? JSON.parse(saved) : { 1: [{ id: 101, user: 'Vyora Official', text: 'So adorable! ❤️' }] };
      });

      const [activeTab, setActiveTab] = React.useState('feed');
      const [userName] = React.useState('Vyora Elite');
      const [caption, setCaption] = React.useState('');
      const [previewUrl, setPreviewUrl] = React.useState('');
      const [activeCommentPost, setActiveCommentPost] = React.useState(null);
      const [commentInput, setCommentInput] = React.useState('');
      const [likedPosts, setLikedPosts] = React.useState({});
      const [savedPosts, setSavedPosts] = React.useState({});
      const [activeStoryViewer, setActiveStoryViewer] = React.useState(null);
      const [toastMessage, setToastMessage] = React.useState('');

      React.useEffect(() => {
        localStorage.setItem('vyora_posts_v4', JSON.stringify(posts));
      }, [posts]);

      React.useEffect(() => {
        localStorage.setItem('vyora_comments_v4', JSON.stringify(commentsMap));
      }, [commentsMap]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 2200);
      };

      const handleShare = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(window.location.href);
        }
        showToast('✨ Link copied to clipboard!');
      };

      const handleFileSelection = (e, type = 'post') => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          if (type === 'story') {
            const newStory = { id: Date.now(), user: userName, img: event.target.result };
            setStories([stories[0], newStory, ...stories.slice(1)]);
            showToast('🌟 Story added successfully!');
          } else {
            setPreviewUrl(event.target.result);
            setActiveTab('create');
          }
        };
        reader.readAsDataURL(file);
      };

      const handlePublish = () => {
        if (!previewUrl) return;
        const newPost = {
          id: Date.now(),
          user_name: userName,
          caption: caption,
          image_url: previewUrl,
          likes: 1
        };
        setPosts([newPost, ...posts]);
        setLikedPosts(prev => ({ ...prev, [newPost.id]: true }));
        setPreviewUrl('');
        setCaption('');
        setActiveTab('feed');
        showToast('🚀 Post published!');
      };

      const handleLike = (id, currentLikes) => {
        const isLiked = likedPosts[id];
        const newLikes = isLiked ? Math.max(0, (currentLikes || 1) - 1) : (currentLikes || 0) + 1;
        setLikedPosts({ ...likedPosts, [id]: !isLiked });
        setPosts(posts.map(p => p.id === id ? { ...p, likes: newLikes } : p));
      };

      const handleAddComment = (postId) => {
        if (!commentInput.trim()) return;
        const current = commentsMap[postId] || [];
        const updated = [...current, { id: Date.now(), user: userName, text: commentInput }];
        setCommentsMap({ ...commentsMap, [postId]: updated });
        setCommentInput('');
      };

      return (
        <div class="max-w-md mx-auto h-full flex flex-col bg-black text-white relative border-x border-zinc-900 shadow-2xl">

          {/* CUSTOM GLASS TOAST NOTIFICATION */}
          {toastMessage && (
            <div class="absolute top-16 left-1/2 -translate-x-1/2 z-50 bg-zinc-900/90 border border-pink-500/40 px-4 py-2 rounded-full text-xs font-semibold text-pink-300 shadow-xl backdrop-blur-md toast-anim">
              {toastMessage}
            </div>
          )}

          {/* HEADER */}
          <header class="h-14 glass-header flex items-center justify-between px-4 flex-shrink-0 z-30">
            <div class="flex items-center space-x-1.5">
              <h1 class="text-2xl font-black tracking-widest bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 bg-clip-text text-transparent italic">VYORA</h1>
              <span class="bg-gradient-to-r from-pink-500 to-purple-500 text-[8px] font-bold px-1.5 py-0.5 rounded-full">PRO</span>
            </div>
            <div class="flex items-center space-x-5 text-xl">
              <button onClick={() => setActiveTab('explore')}><i class="far fa-compass hover:text-pink-500"></i></button>
              <button onClick={() => showToast('💬 No new messages')} class="relative">
                <i class="far fa-paper-plane hover:text-cyan-400"></i>
              </button>
            </div>
          </header>

          {/* MAIN CONTENT */}
          <main class="flex-1 overflow-y-auto hide-scrollbar relative">

            {activeTab === 'feed' && (
              <div class="pb-20">
                {/* STORIES TRAY */}
                <div class="p-3 bg-zinc-950/80 border-b border-zinc-900 overflow-x-auto hide-scrollbar flex space-x-4 items-center">
                  {stories.map((story) => (
                    story.isMe ? (
                      <label key={story.id} class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer">
                        <div class="relative w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600">
                          <img src={story.img} class="w-full h-full rounded-full object-cover border-2 border-black" />
                          <span class="absolute bottom-0 right-0 bg-cyan-400 text-black rounded-full w-5 h-5 flex items-center justify-center text-xs font-black border-2 border-black">+</span>
                        </div>
                        <span class="text-[10px] text-zinc-300">Add Story</span>
                        <input type="file" accept="image/*,video/*" class="hidden" onChange={(e) => handleFileSelection(e, 'story')} />
                      </label>
                    ) : (
                      <div key={story.id} onClick={() => setActiveStoryViewer(story)} class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer">
                        <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-400">
                          <img src={story.img} class="w-full h-full rounded-full object-cover border-2 border-black" />
                        </div>
                        <span class="text-[10px] text-zinc-300 truncate w-16 text-center">{story.user}</span>
                      </div>
                    )
                  ))}
                </div>

                {/* POSTS LIST */}
                <div class="divide-y divide-zinc-900">
                  {posts.map(post => (
                    <div key={post.id} class="pb-3 bg-black">
                      <div class="flex items-center justify-between px-3 py-2.5">
                        <div class="flex items-center space-x-2">
                          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 to-cyan-400 p-[1px]">
                            <div class="w-full h-full bg-black rounded-full flex items-center justify-center text-xs font-bold text-pink-400">
                              {post.user_name[0]}
                            </div>
                          </div>
                          <span class="text-xs font-bold">{post.user_name}</span>
                          <i class="fas fa-check-circle text-cyan-400 text-[10px]"></i>
                        </div>
                        <i class="fas fa-ellipsis-h text-zinc-500 text-xs"></i>
                      </div>

                      <div onDoubleClick={() => handleLike(post.id, post.likes)} class="w-full bg-zinc-950 flex items-center justify-center max-h-[500px] overflow-hidden">
                        <img src={post.image_url} class="w-full object-cover max-h-[500px]" />
                      </div>

                      <div class="flex justify-between px-4 py-3 text-xl">
                        <div class="flex space-x-5">
                          <button onClick={() => handleLike(post.id, post.likes)}>
                            {likedPosts[post.id] ? <i class="fas fa-heart text-pink-500"></i> : <i class="far fa-heart hover:text-pink-500"></i>}
                          </button>
                          <button onClick={() => setActiveCommentPost(post)}><i class="far fa-comment hover:text-cyan-400"></i></button>
                          <button onClick={handleShare}><i class="far fa-paper-plane hover:text-purple-400"></i></button>
                        </div>
                        <button onClick={() => {
                          const status = !savedPosts[post.id];
                          setSavedPosts({ ...savedPosts, [post.id]: status });
                          showToast(status ? 'Saved to collection!' : 'Removed from saved');
                        }}>
                          {savedPosts[post.id] ? <i class="fas fa-bookmark text-cyan-400"></i> : <i class="far fa-bookmark hover:text-cyan-400"></i>}
                        </button>
                      </div>

                      <div class="px-4 text-xs space-y-1">
                        <p class="font-bold">{post.likes || 0} likes</p>
                        {post.caption && <p><span class="font-bold mr-2">{post.user_name}</span><span class="text-zinc-300">{post.caption}</span></p>}
                        <button onClick={() => setActiveCommentPost(post)} class="text-zinc-500 pt-1 block font-semibold">
                          View all comments ({(commentsMap[post.id] || []).length})
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'explore' && (
              <div class="p-2 grid grid-cols-3 gap-1 pb-20">
                {posts.map(p => (
                  <div key={p.id} class="aspect-square bg-zinc-900 overflow-hidden">
                    <img src={p.image_url} class="w-full h-full object-cover" />
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'create' && (
              <div class="p-4 space-y-4 pb-20">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <button onClick={() => setActiveTab('feed')} class="text-xs text-zinc-400">Cancel</button>
                  <h2 class="font-bold text-sm text-pink-400">New Magic Post</h2>
                  <button onClick={handlePublish} class="text-cyan-400 font-bold text-xs">Share</button>
                </div>
                <div class="flex space-x-4">
                  <div class="w-24 h-32 bg-zinc-900 rounded-lg overflow-hidden flex-shrink-0 border border-zinc-800">
                    <img src={previewUrl} class="w-full h-full object-cover" />
                  </div>
                  <textarea
                    class="w-full bg-transparent text-xs text-white placeholder-zinc-500 focus:outline-none resize-none pt-1"
                    placeholder="Write a caption..."
                    rows="5"
                    value={caption}
                    onChange={(e) => setCaption(e.target.value)}
                  ></textarea>
                </div>
              </div>
            )}

            {activeTab === 'profile' && (
              <div class="p-4 space-y-6 pb-20">
                <div class="flex justify-between items-center">
                  <h2 class="font-bold text-base">{userName} <i class="fas fa-check-circle text-cyan-400 text-xs"></i></h2>
                </div>
                <div class="flex items-center space-x-6">
                  <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 p-[2.5px]">
                    <div class="w-full h-full bg-black rounded-full flex items-center justify-center font-bold text-xl text-pink-400">
                      {userName[0]}
                    </div>
                  </div>
                  <div class="flex space-x-6 text-center text-xs flex-1 justify-around">
                    <div><p class="font-bold text-sm text-pink-400">{posts.length}</p><p class="text-zinc-500">Posts</p></div>
                    <div><p class="font-bold text-sm text-cyan-400">1.2M</p><p class="text-zinc-500">Followers</p></div>
                    <div><p class="font-bold text-sm text-purple-400">142</p><p class="text-zinc-500">Following</p></div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* COMMENTS DRAWER */}
          {activeCommentPost && (
            <div class="absolute inset-0 z-50 bg-black/85 backdrop-blur-md flex flex-col justify-end">
              <div class="bg-zinc-950 w-full rounded-t-3xl border-t border-zinc-800 max-h-[80%] flex flex-col shadow-2xl">
                <div class="flex justify-between items-center p-4 border-b border-zinc-900">
                  <span class="text-xs font-bold text-pink-400 tracking-wider">COMMENTS</span>
                  <button onClick={() => setActiveCommentPost(null)} class="text-white text-lg font-bold px-2">✕</button>
                </div>
                
                <div class="flex-1 overflow-y-auto p-4 space-y-3 min-h-[150px]">
                  {(!commentsMap[activeCommentPost.id] || commentsMap[activeCommentPost.id].length === 0) ? (
                    <p class="text-center text-zinc-500 text-xs py-8">No comments yet. Be the first to comment!</p>
                  ) : (
                    commentsMap[activeCommentPost.id].map(c => (
                      <div key={c.id} class="flex items-start space-x-2 text-xs">
                        <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-pink-500 to-cyan-400 flex items-center justify-center font-bold text-[10px] text-black">
                          {c.user[0]}
                        </div>
                        <div>
                          <span class="font-bold mr-2 text-pink-300">{c.user}</span>
                          <span class="text-zinc-200">{c.text}</span>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div class="p-3 border-t border-zinc-900 flex space-x-2 bg-black mb-14">
                  <input 
                    type="text" 
                    value={commentInput} 
                    onChange={(e) => setCommentInput(e.target.value)} 
                    placeholder="Add a comment..." 
                    class="w-full bg-zinc-900 text-xs px-4 py-3 rounded-full border border-zinc-800 text-white focus:outline-none focus:border-pink-500"
                  />
                  <button onClick={() => handleAddComment(activeCommentPost.id)} class="bg-gradient-to-r from-pink-500 to-purple-500 px-4 rounded-full text-xs font-bold text-white">Post</button>
                </div>
              </div>
            </div>
          )}

          {/* STORY VIEWER */}
          {activeStoryViewer && (
            <div class="absolute inset-0 z-50 bg-black flex flex-col justify-between p-4">
              <div class="flex justify-between items-center pt-2 z-10">
                <span class="text-xs font-bold">{activeStoryViewer.user}</span>
                <button onClick={() => setActiveStoryViewer(null)} class="text-white text-xl font-bold px-2">✕</button>
              </div>
              <div class="flex-1 flex items-center justify-center">
                <img src={activeStoryViewer.img} class="max-h-[75vh] object-contain rounded-xl" />
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION */}
          <nav class="h-14 glass-nav flex justify-around items-center z-40 text-xl absolute bottom-0 left-0 right-0 max-w-md mx-auto">
            <button onClick={() => setActiveTab('feed')} class={activeTab === 'feed' ? 'text-pink-500' : 'text-zinc-500'}><i class="fas fa-home"></i></button>
            <button onClick={() => setActiveTab('explore')} class={activeTab === 'explore' ? 'text-pink-500' : 'text-zinc-500'}><i class="fas fa-search"></i></button>

            <label class="cursor-pointer bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-400 w-10 h-10 rounded-xl flex items-center justify-center text-white active:scale-95 shadow-lg">
              <i class="fas fa-plus text-sm"></i>
              <input type="file" accept="image/*,video/*" class="hidden" onChange={(e) => handleFileSelection(e, 'post')} />
            </label>

            <button onClick={() => setActiveTab('explore')} class={activeTab === 'reels' ? 'text-pink-500' : 'text-zinc-500'}><i class="fas fa-film"></i></button>
            <button onClick={() => setActiveTab('profile')} class={activeTab === 'profile' ? 'text-cyan-400' : 'text-zinc-500'}><i class="far fa-user"></i></button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
