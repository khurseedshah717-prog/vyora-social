<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #4A90E2;
            color: white;
            padding: 40px 20px;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        p {
            font-size: 1.2em;
        }
        .container {
            padding: 50px 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4A90E2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Aapki nayi website tayar hai!</p>
    </header>

    <div class="container">
        <h2>Aapka Content Yahan Aayega</h2>
        <p>Yeh ek simple aur clean layout hai jise aap aage edit kar sakte hain.</p>
        <a href="#" class="btn">Click Here</a>
    </div>

</body>
</html>
