<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYORA</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white min-h-screen select-none">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://bquuaxzsjtiycqbzrmtn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_rOljy0MN3Uvbb-0KYR181Q_Sm2-HHnQ';
    
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    function App() {
      const [posts, setPosts] = React.useState([]);
      const [userName, setUserName] = React.useState('Vyora User');
      const [userHandle, setUserHandle] = React.useState('@user');
      const [activeTab, setActiveTab] = React.useState('feed'); // feed, reels, create, profile
      
      const [newText, setNewText] = React.useState('');
      const [newMedia, setNewMedia] = React.useState('');
      const [mediaType, setMediaType] = React.useState('image');
      const [loading, setLoading] = React.useState(true);
      const [posting, setPosting] = React.useState(false);

      const [activeCommentPostId, setActiveCommentPostId] = React.useState(null);
      const [commentText, setCommentText] = React.useState('');
      const [commentsMap, setCommentsMap] = React.useState({});

      const fetchPosts = async () => {
        if (!supabaseClient) return;
        try {
          const { data, error } = await supabaseClient
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false });

          if (!error && data) setPosts(data);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      React.useEffect(() => {
        fetchPosts();
      }, []);

      const handleLike = async (id, currentLikes) => {
        const newLikes = (currentLikes || 0) + 1;
        setPosts(posts.map(p => p.id === id ? { ...p, likes: newLikes } : p));
        if (supabaseClient) {
          await supabaseClient.from('posts').update({ likes: newLikes }).eq('id', id);
        }
      };

      // Instagram Style Universal Media Handler (Photos & Videos both supported)
      const handleMediaSelect = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.type.startsWith('video/') || file.name.match(/\.(mp4|mkv|mov|webm|3gp)$/i)) {
          setMediaType('video');
          const reader = new FileReader();
          reader.onload = (event) => {
            setNewMedia(event.target.result);
            setActiveTab('create'); // Switch to caption screen
          };
          reader.readAsDataURL(file);
        } else {
          setMediaType('image');
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800;
              const scaleFactor = MAX_WIDTH / img.width;
              canvas.width = MAX_WIDTH;
              canvas.height = img.height * scaleFactor;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              setNewMedia(canvas.toDataURL('image/jpeg', 0.8));
              setActiveTab('create'); // Switch to caption screen
            };
          };
          reader.readAsDataURL(file);
        }
      };

      const handleCreatePost = async () => {
        if (!newMedia) {
          alert('Please select a photo or video first!');
          return;
        }

        setPosting(true);
        const newPostData = {
          user_name: userName || 'Anonymous',
          user_handle: userHandle || '@user',
          caption: newText,
          image_url: newMedia,
          likes: 0
        };

        if (supabaseClient) {
          const { data, error } = await supabaseClient
            .from('posts')
            .insert([newPostData])
            .select();

          setPosting(false);

          if (error) {
            alert('Error: ' + error.message);
          } else if (data && data.length > 0) {
            setPosts([data[0], ...posts]);
            setNewText('');
            setNewMedia('');
            setActiveTab('feed');
          }
        }
      };

      const handleAddComment = (postId) => {
        if (!commentText.trim()) return;
        const existing = commentsMap[postId] || [];
        const newComment = {
          id: Date.now(),
          user: userName,
          text: commentText
        };
        setCommentsMap({ ...commentsMap, [postId]: [...existing, newComment] });
        setCommentText('');
      };

      const isVideoFormat = (url) => {
        if (!url) return false;
        return url.startsWith('data:video') || url.match(/\.(mp4|mkv|mov|webm|3gp)$/i);
      };

      return (
        <div class="max-w-md mx-auto min-h-screen bg-black text-white flex flex-col justify-between pb-16">
          
          {/* Top Header */}
          <header class="sticky top-0 z-50 bg-black/90 backdrop-blur-md flex justify-between items-center px-4 py-3 border-b border-zinc-800">
            <h1 class="text-xl font-bold tracking-wider text-white font-serif italic">VYORA</h1>
            <div class="flex items-center space-x-4">
              <span class="text-xl">♡</span>
              <span class="text-xl">⚡</span>
            </div>
          </header>

          {/* Main Content Area */}
          <main class="flex-1 overflow-y-auto">
            
            {/* 1. FEED TAB */}
            {activeTab === 'feed' && (
              <div>
                {loading ? (
                  <div class="flex justify-center items-center py-20">
                    <div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                  </div>
                ) : posts.length === 0 ? (
                  <div class="text-center py-20 text-zinc-500 text-sm">No posts yet. Tap (+) to share!</div>
                ) : (
                  posts.map(post => (
                    <div key={post.id} class="border-b border-zinc-900 pb-3 mb-3">
                      {/* Post Header */}
                      <div class="flex items-center justify-between px-3 py-2">
                        <div class="flex items-center space-x-2">
                          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-yellow-500 to-purple-600 p-[2px]">
                            <div class="w-full h-full bg-black rounded-full flex items-center justify-center font-bold text-xs">
                              {post.user_name ? post.user_name[0].toUpperCase() : 'U'}
                            </div>
                          </div>
                          <span class="text-xs font-semibold">{post.user_name}</span>
                        </div>
                        <span class="text-zinc-400 text-sm">•••</span>
                      </div>

                      {/* Post Media (Photo / Video) */}
                      <div class="w-full bg-zinc-950 flex items-center justify-center max-h-[500px] overflow-hidden">
                        {isVideoFormat(post.image_url) ? (
                          <video src={post.image_url} controls class="w-full max-h-[500px] object-contain bg-black" />
                        ) : (
                          <img src={post.image_url} alt="Post" class="w-full max-h-[500px] object-contain" />
                        )}
                      </div>

                      {/* Action Buttons */}
                      <div class="flex justify-between px-4 py-2.5">
                        <div class="flex space-x-4 text-xl">
                          <button onClick={() => handleLike(post.id, post.likes)} class="active:scale-125 transition-transform">❤️</button>
                          <button onClick={() => setActiveCommentPostId(activeCommentPostId === post.id ? null : post.id)}>💬</button>
                          <span>✈️</span>
                        </div>
                        <span>🔖</span>
                      </div>

                      {/* Likes & Caption */}
                      <div class="px-4 text-xs space-y-1">
                        <p class="font-semibold">{post.likes || 0} likes</p>
                        {post.caption && (
                          <p><span class="font-semibold mr-2">{post.user_name}</span>{post.caption}</p>
                        )}
                        <button 
                          onClick={() => setActiveCommentPostId(activeCommentPostId === post.id ? null : post.id)} 
                          class="text-zinc-400 pt-1 block"
                        >
                          View all comments ({(commentsMap[post.id] || []).length})
                        </button>
                      </div>

                      {/* Comments Drawer / Section */}
                      {activeCommentPostId === post.id && (
                        <div class="mt-2 px-4 py-2 bg-zinc-950 rounded-lg mx-3 border border-zinc-800">
                          <div class="space-y-2 mb-2 max-h-28 overflow-y-auto">
                            {(commentsMap[post.id] || []).map(c => (
                              <div key={c.id} class="text-xs">
                                <span class="font-bold text-zinc-300 mr-1">{c.user}:</span>
                                <span class="text-zinc-400">{c.text}</span>
                              </div>
                            ))}
                          </div>
                          <div class="flex space-x-2">
                            <input 
                              type="text"
                              value={commentText}
                              onChange={(e) => setCommentText(e.target.value)}
                              placeholder="Add a comment..."
                              class="w-full bg-zinc-900 text-xs text-white px-3 py-1.5 rounded-full border border-zinc-800 focus:outline-none"
                            />
                            <button onClick={() => handleAddComment(post.id)} class="text-blue-500 font-semibold text-xs px-2">Post</button>
                          </div>
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>
            )}

            {/* 2. REELS TAB */}
            {activeTab === 'reels' && (
              <div class="space-y-4">
                {posts.filter(p => isVideoFormat(p.image_url)).length === 0 ? (
                  <div class="text-center py-32 text-zinc-500 text-sm">No Reels available yet.</div>
                ) : (
                  posts.filter(p => isVideoFormat(p.image_url)).map(reel => (
                    <div key={reel.id} class="relative w-full h-[75vh] bg-black flex items-center justify-center border-b border-zinc-900">
                      <video src={reel.image_url} controls autoPlay loop muted class="w-full h-full object-cover" />
                      <div class="absolute bottom-6 left-4 right-12 z-10">
                        <div class="flex items-center space-x-2 mb-2">
                          <div class="w-7 h-7 rounded-full bg-zinc-700 flex items-center justify-center font-bold text-xs">
                            {reel.user_name[0]}
                          </div>
                          <span class="text-xs font-semibold">{reel.user_name}</span>
                        </div>
                        <p class="text-xs text-zinc-200">{reel.caption}</p>
                      </div>
                      <div class="absolute right-3 bottom-12 flex flex-col items-center space-y-4 z-10 text-xl">
                        <button onClick={() => handleLike(reel.id, reel.likes)} class="flex flex-col items-center text-xs">
                          <span>❤️</span>
                          <span class="text-[10px] mt-0.5">{reel.likes || 0}</span>
                        </button>
                        <span>💬</span>
                        <span>↗️</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* 3. CREATE / POST DETAILS TAB (Opens automatically after selecting media) */}
            {activeTab === 'create' && (
              <div class="p-4 space-y-4">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <button onClick={() => setActiveTab('feed')} class="text-sm text-zinc-400">Cancel</button>
                  <h2 class="font-semibold text-sm">New Post</h2>
                  <button 
                    onClick={handleCreatePost} 
                    disabled={posting} 
                    class="text-blue-500 font-semibold text-sm disabled:opacity-50"
                  >
                    {posting ? 'Sharing...' : 'Share'}
                  </button>
                </div>

                <div class="flex space-x-4 items-start">
                  <div class="w-20 h-20 bg-zinc-900 rounded-lg overflow-hidden flex-shrink-0 border border-zinc-800">
                    {mediaType === 'video' ? (
                      <video src={newMedia} class="w-full h-full object-cover" />
                    ) : (
                      <img src={newMedia} alt="Preview" class="w-full h-full object-cover" />
                    )}
                  </div>
                  <textarea
                    class="w-full bg-transparent text-sm text-white placeholder-zinc-600 focus:outline-none resize-none pt-1"
                    placeholder="Write a caption..."
                    rows="4"
                    value={newText}
                    onChange={(e) => setNewText(e.target.value)}
                  ></textarea>
                </div>
              </div>
            )}

            {/* 4. PROFILE TAB */}
            {activeTab === 'profile' && (
              <div class="p-4 space-y-6">
                <div class="flex justify-between items-center">
                  <h2 class="font-bold text-lg">{userName}</h2>
                  <input 
                    type="text" 
                    value={userName} 
                    onChange={(e) => setUserName(e.target.value)} 
                    class="bg-zinc-900 border border-zinc-800 text-xs px-2 py-1 rounded text-zinc-300 w-28 text-right"
                    placeholder="Edit Name"
                  />
                </div>
                <div class="flex items-center space-x-6">
                  <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-yellow-500 to-purple-600 p-[2px]">
                    <div class="w-full h-full bg-black rounded-full flex items-center justify-center text-xl font-bold">
                      {userName[0]}
                    </div>
                  </div>
                  <div class="flex space-x-6 text-center text-sm">
                    <div>
                      <p class="font-bold">{posts.length}</p>
                      <p class="text-zinc-500 text-xs">Posts</p>
                    </div>
                    <div>
                      <p class="font-bold">0</p>
                      <p class="text-zinc-500 text-xs">Followers</p>
                    </div>
                    <div>
                      <p class="font-bold">0</p>
                      <p class="text-zinc-500 text-xs">Following</p>
                    </div>
                  </div>
                </div>
                <div>
                  <p class="text-xs text-zinc-400">{userHandle}</p>
                  <p class="text-xs mt-1">Digital creator ✨ Building Vyora app 🚀</p>
                </div>
              </div>
            )}

          </main>

          {/* Instagram Style Bottom Navigation Bar */}
          <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-black border-t border-zinc-800 flex justify-around items-center py-2.5 z-50">
            <button onClick={() => setActiveTab('feed')} class={`text-2xl ${activeTab === 'feed' ? 'text-white font-bold' : 'text-zinc-400'}`}>🏠</button>
            <button onClick={() => setActiveTab('reels')} class={`text-2xl ${activeTab === 'reels' ? 'text-white font-bold' : 'text-zinc-400'}`}>🎬</button>
            
            {/* Hidden File Input triggered by Center (+) Button */}
            <label class="cursor-pointer bg-gradient-to-tr from-yellow-500 via-red-500 to-purple-600 p-2.5 rounded-xl flex items-center justify-center text-white active:scale-95 transition-transform shadow-lg">
              <span class="text-lg font-bold leading-none">+</span>
              <input 
                type="file" 
                accept="image/*,video/*" 
                class="hidden" 
                onChange={handleMediaSelect} 
              />
            </label>

            <button onClick={() => setActiveTab('feed')} class="text-2xl text-zinc-400">❤️</button>
            <button onClick={() => setActiveTab('profile')} class={`text-xl font-bold rounded-full w-7 h-7 border flex items-center justify-center ${activeTab === 'profile' ? 'border-white text-white' : 'border-zinc-700 text-zinc-400'}`}>
              {userName[0].toUpperCase()}
            </button>
          </nav>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
