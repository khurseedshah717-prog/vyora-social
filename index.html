<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VYORA - Ultimate Social Experience</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; }
    .glass-nav { background: rgba(10, 10, 12, 0.9); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-top: 1px solid rgba(255, 255, 255, 0.1); }
    .glass-header { background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes pulseGlow {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.8); }
      50% { transform: scale(1.25); box-shadow: 0 0 25px 10px rgba(168, 85, 247, 0.6); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.5); opacity: 1; }
      100% { transform: translateY(-100px) scale(1.6); opacity: 0; }
    }
    .magic-active { animation: pulseGlow 0.35s ease-in-out; }
    .floating-spark {
      position: fixed;
      pointer-events: none;
      animation: floatUp 0.8s forwards ease-out;
      font-size: 28px;
      z-index: 9999;
    }
  </style>
</head>
<body class="select-none">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      // Initial demo posts agar database empty ho
      const [posts, setPosts] = React.useState(() => {
        const saved = localStorage.getItem('vyora_posts_v2');
        if (saved) return JSON.parse(saved);
        return [
          {
            id: 1,
            user_name: 'Ayesha_VIP',
            caption: 'Happy birthday my dear bachu my patato my cutie pie 🥰🥰🥰 god bless you i love you so much 🥰🥰🥰',
            image_url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=80',
            likes: 142,
            created_at: Date.now()
          }
        ];
      });

      const [stories, setStories] = React.useState(() => {
        const saved = localStorage.getItem('vyora_stories_v2');
        if (saved) return JSON.parse(saved);
        return [
          { id: 1, user: 'Vyora Official', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60' },
          { id: 2, user: 'Ayesha_VIP', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60' }
        ];
      });

      const [commentsMap, setCommentsMap] = React.useState(() => {
        const saved = localStorage.getItem('vyora_comments_v2');
        return saved ? JSON.parse(saved) : { 1: [{ id: 101, user: 'Vyora Official', text: 'So adorable! ❤️' }] };
      });

      const [activeTab, setActiveTab] = React.useState('feed'); // feed, explore, reels, dm, profile
      const [userName, setUserName] = React.useState('Vyora Elite');
      const [caption, setCaption] = React.useState('');
      const [previewUrl, setPreviewUrl] = React.useState('');
      const [mediaType, setMediaType] = React.useState('image');
      const [uploadType, setUploadType] = React.useState('post');
      const [posting, setPosting] = React.useState(false);

      // Interactive States
      const [activeCommentPost, setActiveCommentPost] = React.useState(null);
      const [commentInput, setCommentInput] = React.useState('');
      const [savedPosts, setSavedPosts] = React.useState({});
      const [likedPosts, setLikedPosts] = React.useState({});
      const [sparks, setSparks] = React.useState([]);
      const [activeStoryViewer, setActiveStoryViewer] = React.useState(null);

      // DM Chat State
      const [chatMessages, setChatMessages] = React.useState([
        { id: 1, sender: 'Ayesha_VIP', text: 'Hey! Welcome to Vyora Pro 🔥', incoming: true },
        { id: 2, sender: 'Vyora Elite', text: 'This is super smooth and fast now!', incoming: false }
      ]);
      const [chatInput, setChatInput] = React.useState('');

      // Save to localStorage whenever data changes
      React.useEffect(() => {
        localStorage.setItem('vyora_posts_v2', JSON.stringify(posts));
      }, [posts]);

      React.useEffect(() => {
        localStorage.setItem('vyora_stories_v2', JSON.stringify(stories));
      }, [stories]);

      React.useEffect(() => {
        localStorage.setItem('vyora_comments_v2', JSON.stringify(commentsMap));
      }, [commentsMap]);

      const triggerMagicSpark = (e, emoji = '💖') => {
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2;
        const clientY = e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2;
        const newSpark = { id: Date.now() + Math.random(), x: clientX, y: clientY, emoji };
        setSparks(prev => [...prev, newSpark]);
        setTimeout(() => {
          setSparks(prev => prev.filter(s => s.id !== newSpark.id));
        }, 800);
      };

      const handleFileSelection = (e, type = 'post') => {
        const file = e.target.files[0];
        if (!file) return;

        setUploadType(type);
        const isVid = file.type.startsWith('video/') || file.name.match(/\.(mp4|mkv|mov|webm)$/i);
        setMediaType(isVid ? 'video' : 'image');

        const reader = new FileReader();
        reader.onload = (event) => {
          setPreviewUrl(event.target.result);
          setActiveTab('create');
        };
        reader.readAsDataURL(file);
      };

      const handlePublish = () => {
        if (!previewUrl) return;
        setPosting(true);

        setTimeout(() => {
          if (uploadType === 'story') {
            const newStory = { id: Date.now(), user: userName, img: previewUrl };
            setStories([newStory, ...stories]);
          } else {
            const newPost = {
              id: Date.now(),
              user_name: userName,
              caption: caption,
              image_url: previewUrl,
              likes: 1,
              created_at: Date.now()
            };
            setPosts([newPost, ...posts]);
            setLikedPosts(prev => ({ ...prev, [newPost.id]: true }));
          }
          setPreviewUrl('');
          setCaption('');
          setPosting(false);
          setActiveTab('feed');
        }, 300);
      };

      const handleLike = (e, id, currentLikes) => {
        triggerMagicSpark(e, '💖');
        const isLiked = likedPosts[id];
        const newLikes = isLiked ? Math.max(0, (currentLikes || 1) - 1) : (currentLikes || 0) + 1;
        
        setLikedPosts({ ...likedPosts, [id]: !isLiked });
        setPosts(posts.map(p => p.id === id ? { ...p, likes: newLikes } : p));
      };

      const toggleSave = (e, id) => {
        triggerMagicSpark(e, '✨');
        setSavedPosts({ ...savedPosts, [id]: !savedPosts[id] });
      };

      const handleShare = (e, post) => {
        triggerMagicSpark(e, '🚀');
        if (navigator.share) {
          navigator.share({
            title: 'VYORA Post',
            text: post.caption || 'Check out this magical post!',
            url: window.location.href,
          }).catch(() => {});
        } else {
          navigator.clipboard.writeText(window.location.href);
          alert('Link Copied to Clipboard!');
        }
      };

      const handleAddComment = (postId) => {
        if (!commentInput.trim()) return;
        const currentComments = commentsMap[postId] || [];
        const newComment = { id: Date.now(), user: userName, text: commentInput };
        setCommentsMap({ ...commentsMap, [postId]: [...currentComments, newComment] });
        setCommentInput('');
      };

      const sendChatMessage = () => {
        if (!chatInput.trim()) return;
        setChatMessages([...chatMessages, { id: Date.now(), sender: userName, text: chatInput, incoming: false }]);
        setChatInput('');
      };

      const isVideoFormat = (url) => {
        if (!url) return false;
        return url.startsWith('data:video') || url.match(/\.(mp4|mkv|mov|webm)$/i);
      };

      return (
        <div class="max-w-md mx-auto min-h-screen bg-black text-white flex flex-col justify-between pb-20 relative border-x border-zinc-900 shadow-[0_0_50px_rgba(236,72,153,0.12)]">
          
          {/* Floating Magic Sparks */}
          {sparks.map(spark => (
            <div key={spark.id} class="floating-spark" style={{ left: `${spark.x - 14}px`, top: `${spark.y - 14}px` }}>
              {spark.emoji}
            </div>
          ))}

          {/* Top Header */}
          <header class="sticky top-0 z-40 glass-header flex justify-between items-center px-4 py-3 border-b border-zinc-800/80">
            <div class="flex items-center space-x-1.5">
              <h1 class="text-2xl font-black tracking-widest bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 bg-clip-text text-transparent italic">VYORA</h1>
              <span class="bg-gradient-to-r from-pink-500 to-purple-500 text-[9px] font-bold px-1.5 py-0.5 rounded-full text-white">PRO</span>
            </div>
            <div class="flex items-center space-x-5 text-xl">
              <button onClick={(e) => { triggerMagicSpark(e, '🔥'); setActiveTab('explore'); }} class="hover:text-pink-500 transition-colors"><i class="far fa-compass"></i></button>
              <button onClick={(e) => { triggerMagicSpark(e, '⚡'); setActiveTab('dm'); }} class="hover:text-cyan-400 transition-colors relative">
                <i class="far fa-comment-dots"></i>
                <span class="absolute -top-1 -right-1 bg-pink-500 w-2 h-2 rounded-full animate-pulse"></span>
              </button>
            </div>
          </header>

          <main class="flex-1 overflow-y-auto hide-scrollbar">

            {/* FEED TAB */}
            {activeTab === 'feed' && (
              <>
                {/* Stories Tray - Fully Fixed & Scrollable */}
                <div class="flex space-x-4 p-3 overflow-x-auto hide-scrollbar border-b border-zinc-900/90 items-center bg-zinc-950/60">
                  <label class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer">
                    <div class="relative w-16 h-16 rounded-full p-[2.5px] bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 shadow-lg">
                      <div class="w-full h-full bg-zinc-900 rounded-full flex items-center justify-center border-2 border-black font-bold text-sm overflow-hidden text-pink-400">
                        {userName[0]}
                      </div>
                      <span class="absolute bottom-0 right-0 bg-cyan-500 text-black rounded-full w-5 h-5 flex items-center justify-center text-xs font-black border-2 border-black">+</span>
                    </div>
                    <span class="text-[11px] text-zinc-300 font-medium">Your Story</span>
                    <input type="file" accept="image/*,video/*" class="hidden" onChange={(e) => handleFileSelection(e, 'story')} />
                  </label>

                  {stories.map(story => (
                    <div key={story.id} onClick={() => setActiveStoryViewer(story)} class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer">
                      <div class="w-16 h-16 rounded-full p-[2.5px] bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-400 shadow-md">
                        <img src={story.img} class="w-full h-full rounded-full object-cover border-2 border-black" alt="Story" />
                      </div>
                      <span class="text-[11px] text-zinc-300 truncate w-16 text-center">{story.user}</span>
                    </div>
                  ))}
                </div>

                {/* Posts Feed */}
                <div class="divide-y divide-zinc-900">
                  {posts.length === 0 ? (
                    <div class="text-center py-28 text-zinc-500 text-sm">No posts yet. Tap (+) below to share!</div>
                  ) : (
                    posts.map(post => (
                      <div key={post.id} class="pb-3 bg-black">
                        <div class="flex items-center justify-between px-3 py-2.5">
                          <div class="flex items-center space-x-2.5">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 to-cyan-400 p-[1.5px]">
                              <div class="w-full h-full bg-black rounded-full flex items-center justify-center text-xs font-bold text-pink-400">
                                {post.user_name ? post.user_name[0].toUpperCase() : 'U'}
                              </div>
                            </div>
                            <div class="flex items-center space-x-1">
                              <p class="text-xs font-bold text-zinc-100">{post.user_name}</p>
                              <i class="fas fa-check-circle text-cyan-400 text-[10px]"></i>
                            </div>
                          </div>
                          <i class="fas fa-ellipsis-h text-zinc-500 text-xs"></i>
                        </div>

                        {/* Media Container with Double Tap */}
                        <div 
                          onDoubleClick={(e) => handleLike(e, post.id, post.likes)} 
                          class="w-full bg-zinc-950 flex items-center justify-center max-h-[550px] overflow-hidden relative cursor-pointer"
                        >
                          {isVideoFormat(post.image_url) ? (
                            <video src={post.image_url} controls loop playsInline class="w-full max-h-[550px] object-cover" />
                          ) : (
                            <img src={post.image_url} alt="Post" class="w-full max-h-[550px] object-cover" />
                          )}
                        </div>

                        {/* Action Buttons */}
                        <div class="flex justify-between px-4 py-3 text-xl">
                          <div class="flex space-x-5">
                            <button onClick={(e) => handleLike(e, post.id, post.likes)} class="transition-transform active:scale-150">
                              {likedPosts[post.id] ? (
                                <i class="fas fa-heart text-pink-500 magic-active"></i>
                              ) : (
                                <i class="far fa-heart text-zinc-200 hover:text-pink-500"></i>
                              )}
                            </button>
                            <button onClick={(e) => { triggerMagicSpark(e, '💬'); setActiveCommentPost(post); }} class="hover:text-cyan-400 transition-colors">
                              <i class="far fa-comment"></i>
                            </button>
                            <button onClick={(e) => handleShare(e, post)} class="hover:text-purple-400 transition-colors">
                              <i class="far fa-paper-plane"></i>
                            </button>
                          </div>
                          <button onClick={(e) => toggleSave(e, post.id)} class="transition-transform active:scale-125">
                            {savedPosts[post.id] ? (
                              <i class="fas fa-bookmark text-cyan-400"></i>
                            ) : (
                              <i class="far fa-bookmark text-zinc-200 hover:text-cyan-400"></i>
                            )}
                          </button>
                        </div>

                        <div class="px-4 text-xs space-y-1">
                          <p class="font-bold text-zinc-100">{post.likes || 0} likes</p>
                          {post.caption && (
                            <p><span class="font-bold mr-2 text-zinc-200">{post.user_name}</span><span class="text-zinc-300">{post.caption}</span></p>
                          )}
                          <button onClick={() => setActiveCommentPost(post)} class="text-zinc-500 pt-0.5 block hover:text-zinc-300">
                            View all comments ({(commentsMap[post.id] || []).length})
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </>
            )}

            {/* EXPLORE TAB */}
            {activeTab === 'explore' && (
              <div class="p-2 space-y-3">
                <div class="px-2 pt-2">
                  <div class="bg-zinc-900 rounded-xl px-4 py-2.5 flex items-center space-x-3 border border-zinc-800">
                    <i class="fas fa-search text-zinc-400 text-sm"></i>
                    <input type="text" placeholder="Explore reels, trends & photos..." class="bg-transparent text-xs text-white focus:outline-none w-full" />
                  </div>
                </div>
                <div class="grid grid-cols-3 gap-1">
                  {posts.map(p => (
                    <div key={p.id} class="aspect-[3/4] bg-zinc-900 relative overflow-hidden group">
                      <img src={p.image_url} class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="Explore" />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* REELS TAB */}
            {activeTab === 'reels' && (
              <div class="space-y-4">
                {posts.filter(p => isVideoFormat(p.image_url)).length === 0 ? (
                  <div class="text-center py-32 text-zinc-500 text-sm">No Reels available. Tap (+) to upload video!</div>
                ) : (
                  posts.filter(p => isVideoFormat(p.image_url)).map(reel => (
                    <div key={reel.id} class="relative w-full h-[75vh] bg-black flex items-center justify-center border-b border-zinc-900">
                      <video src={reel.image_url} controls autoPlay loop muted playsInline class="w-full h-full object-cover" />
                      <div class="absolute bottom-6 left-4 right-16 z-10 space-y-2">
                        <div class="flex items-center space-x-2">
                          <span class="text-xs font-bold bg-black/40 px-2 py-1 rounded-full backdrop-blur-md">@{reel.user_name}</span>
                        </div>
                        <p class="text-xs text-zinc-200">{reel.caption}</p>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* DIRECT MESSAGES (DM) TAB */}
            {activeTab === 'dm' && (
              <div class="p-4 flex flex-col h-[78vh]">
                <div class="flex justify-between items-center mb-4">
                  <h2 class="font-bold text-sm text-pink-400">✨ VYORA Direct Chat</h2>
                  <span class="text-xs text-zinc-500">Online</span>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 pr-1">
                  {chatMessages.map(msg => (
                    <div key={msg.id} class={`flex flex-col ${msg.incoming ? 'items-start' : 'items-end'}`}>
                      <div class={`max-w-[75%] px-3.5 py-2 rounded-2xl text-xs ${msg.incoming ? 'bg-zinc-900 border border-zinc-800 text-zinc-200' : 'bg-gradient-to-r from-pink-600 to-purple-600 text-white'}`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                </div>
                <div class="pt-3 flex space-x-2">
                  <input 
                    type="text" 
                    value={chatInput} 
                    onChange={(e) => setChatInput(e.target.value)} 
                    placeholder="Message..." 
                    class="w-full bg-zinc-900 text-xs px-4 py-3 rounded-full border border-zinc-800 text-white focus:outline-none focus:border-pink-500"
                  />
                  <button onClick={sendChatMessage} class="bg-gradient-to-r from-pink-500 to-purple-500 px-4 rounded-full text-xs font-bold">Send</button>
                </div>
              </div>
            )}

            {/* STORY VIEWER MODAL */}
            {activeStoryViewer && (
              <div class="fixed inset-0 z-50 bg-black flex flex-col justify-between p-4">
                <div class="flex justify-between items-center z-10 pt-2">
                  <span class="text-xs font-bold text-white">{activeStoryViewer.user}</span>
                  <button onClick={() => setActiveStoryViewer(null)} class="text-white text-xl font-bold px-3 py-1">✕</button>
                </div>
                <div class="flex-1 flex items-center justify-center relative my-2">
                  <img src={activeStoryViewer.img} class="max-h-[80vh] w-auto rounded-xl object-contain shadow-2xl" alt="Story" />
                </div>
              </div>
            )}

            {/* COMMENTS DRAWER - Fully Working & Fixed */}
            {activeCommentPost && (
              <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex flex-col justify-end">
                <div class="bg-zinc-950 w-full max-w-md mx-auto rounded-t-3xl border-t border-zinc-800 max-h-[75vh] flex flex-col shadow-2xl">
                  <div class="flex justify-between items-center p-4 border-b border-zinc-900">
                    <span class="text-xs font-bold tracking-wider text-pink-400">COMMENTS</span>
                    <button onClick={() => setActiveCommentPost(null)} class="text-zinc-400 font-bold px-2 py-1">✕</button>
                  </div>
                  <div class="flex-1 overflow-y-auto p-4 space-y-3">
                    {(!commentsMap[activeCommentPost.id] || commentsMap[activeCommentPost.id].length === 0) ? (
                      <p class="text-center text-zinc-500 text-xs py-10">No comments yet. Be the first to comment!</p>
                    ) : (
                      commentsMap[activeCommentPost.id].map(c => (
                        <div key={c.id} class="flex items-start space-x-2 text-xs">
                          <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-pink-500 to-cyan-400 flex items-center justify-center font-bold text-[10px] text-black">
                            {c.user[0]}
                          </div>
                          <div>
                            <span class="font-bold mr-2 text-pink-300">{c.user}</span>
                            <span class="text-zinc-300">{c.text}</span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                  <div class="p-3 border-t border-zinc-900 flex space-x-2 bg-black">
                    <input 
                      type="text" 
                      value={commentInput} 
                      onChange={(e) => setCommentInput(e.target.value)} 
                      placeholder="Add a comment..."
                      class="w-full bg-zinc-900 text-xs px-4 py-2.5 rounded-full border border-zinc-800 focus:outline-none focus:border-pink-500 text-white"
                    />
                    <button onClick={() => handleAddComment(activeCommentPost.id)} class="text-pink-500 text-xs font-bold px-3">Post</button>
                  </div>
                </div>
              </div>
            )}

            {/* CREATE / UPLOAD SCREEN */}
            {activeTab === 'create' && (
              <div class="p-4 space-y-4">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <button onClick={() => setActiveTab('feed')} class="text-xs text-zinc-400">Cancel</button>
                  <h2 class="font-bold text-sm text-pink-400">
                    {uploadType === 'story' ? 'New Story' : 'New Post'}
                  </h2>
                  <button 
                    onClick={handlePublish} 
                    disabled={posting} 
                    class="text-cyan-400 font-bold text-xs disabled:opacity-50"
                  >
                    {posting ? 'Sharing...' : 'Share'}
                  </button>
                </div>

                <div class="flex space-x-4">
                  <div class="w-28 h-36 bg-zinc-900 rounded-xl overflow-hidden flex-shrink-0 border border-zinc-800 flex items-center justify-center">
                    {mediaType === 'video' ? (
                      <video src={previewUrl} class="w-full h-full object-cover" />
                    ) : (
                      <img src={previewUrl} alt="Preview" class="w-full h-full object-cover" />
                    )}
                  </div>
                  {uploadType === 'post' && (
                    <textarea
                      class="w-full bg-transparent text-xs text-white placeholder-zinc-500 focus:outline-none resize-none pt-1"
                      placeholder="Write a caption..."
                      rows="6"
                      value={caption}
                      onChange={(e) => setCaption(e.target.value)}
                    ></textarea>
                  )}
                </div>
              </div>
            )}

            {/* PROFILE TAB */}
            {activeTab === 'profile' && (
              <div class="p-4 space-y-6">
                <div class="flex justify-between items-center">
                  <div class="flex items-center space-x-1.5">
                    <h2 class="font-bold text-base">{userName}</h2>
                    <i class="fas fa-check-circle text-cyan-400 text-xs"></i>
                  </div>
                  <i class="fas fa-bars text-lg text-pink-500"></i>
                </div>
                <div class="flex items-center space-x-6">
                  <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 p-[2.5px] shadow-lg">
                    <div class="w-full h-full bg-black rounded-full flex items-center justify-center font-bold text-xl text-pink-400">
                      {userName[0]}
                    </div>
                  </div>
                  <div class="flex space-x-6 text-center text-xs flex-1 justify-around">
                    <div>
                      <p class="font-bold text-sm text-pink-400">{posts.length}</p>
                      <p class="text-zinc-500">Posts</p>
                    </div>
                    <div>
                      <p class="font-bold text-sm text-cyan-400">1.2M</p>
                      <p class="text-zinc-500">Followers</p>
                    </div>
                    <div>
                      <p class="font-bold text-sm text-purple-400">142</p>
                      <p class="text-zinc-500">Following</p>
                    </div>
                  </div>
                </div>
                <div class="text-xs space-y-1">
                  <p class="font-semibold">🚀 VYORA Pro Creator</p>
                  <p class="text-zinc-400">The next-generation social ecosystem ✨</p>
                </div>
              </div>
            )}

          </main>

          {/* Bottom Navigation */}
          <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-nav flex justify-around items-center py-3 z-50 text-xl">
            <button onClick={(e) => { triggerMagicSpark(e, '🏠'); setActiveTab('feed'); }} class={activeTab === 'feed' ? 'text-pink-500' : 'text-zinc-500'}><i class="fas fa-home"></i></button>
            <button onClick={(e) => { triggerMagicSpark(e, '🔍'); setActiveTab('explore'); }} class={activeTab === 'explore' ? 'text-pink-500' : 'text-zinc-500'}><i class="fas fa-search"></i></button>

            {/* Glowing Upload Button */}
            <label onClick={(e) => triggerMagicSpark(e, '✨')} class="cursor-pointer bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-400 w-11 h-11 rounded-2xl flex items-center justify-center text-white active:scale-75 transition-transform shadow-lg">
              <i class="fas fa-plus text-sm"></i>
              <input 
                type="file" 
                accept="image/*,video/*" 
                class="hidden" 
                onChange={(e) => handleFileSelection(e, 'post')} 
              />
            </label>

            <button onClick={(e) => { triggerMagicSpark(e, '🎬'); setActiveTab('reels'); }} class={activeTab === 'reels' ? 'text-pink-500' : 'text-zinc-500'}><i class="fas fa-film"></i></button>
            <button onClick={(e) => { triggerMagicSpark(e, '👤'); setActiveTab('profile'); }} class={activeTab === 'profile' ? 'text-cyan-400' : 'text-zinc-500'}><i class="far fa-user"></i></button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
