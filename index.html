<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 470px; background-color: #000; min-height: 100vh; padding-bottom: 70px; border-left: 1px solid #262626; border-right: 1px solid #262626; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #262626; position: sticky; top: 0; background: #000; z-index: 10; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-icons i { font-size: 20px; margin-left: 18px; cursor: pointer; }

        /* Story Bar */
        .stories-container { display: flex; overflow-x: auto; padding: 12px 10px; border-bottom: 1px solid #262626; scrollbar-width: none; }
        .story { display: flex; flex-direction: column; align-items: center; margin-right: 14px; cursor: pointer; text-align: center; }
        .story-img-bg { width: 66px; height: 66px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); display: flex; justify-content: center; align-items: center; padding: 2px; }
        .story img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #000; object-fit: cover; }
        .story span { font-size: 11px; margin-top: 5px; color: #ccc; max-width: 65px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Post Feed */
        .post { border-bottom: 1px solid #262626; margin-bottom: 15px; }
        .post-header { display: flex; align-items: center; padding: 10px 14px; justify-content: space-between; }
        .post-user { display: flex; align-items: center; }
        .post-header img { width: 34px; height: 34px; border-radius: 50%; margin-right: 10px; object-fit: cover; }
        .post-header .username { font-weight: 600; font-size: 14px; }
        .post-img img { width: 100%; display: block; max-height: 500px; object-fit: cover; }
        .post-actions { display: flex; justify-content: space-between; padding: 12px; font-size: 22px; }
        .post-actions i { margin-right: 16px; cursor: pointer; }
        .post-actions i.fa-heart.active { color: #ed4956; }
        .likes { padding: 0 12px; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        .caption { padding: 0 12px 12px; font-size: 14px; }
        .caption span { font-weight: 600; margin-right: 6px; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 470px; background: #000; border-top: 1px solid #262626; display: flex; justify-content: space-around; padding: 14px 0; font-size: 22px; z-index: 10; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="logo">Instagram Pro</div>
        <div class="header-icons">
            <i class="far fa-heart"></i>
            <i class="fab fa-facebook-messenger"></i>
        </div>
    </div>

    <div class="stories-container">
        <div class="story">
            <div class="story-img-bg"><img src="https://picsum.photos/100/100?random=1" alt="User"></div>
            <span>Your Story</span>
        </div>
        <div class="story">
            <div class="story-img-bg"><img src="https://picsum.photos/100/100?random=2" alt="User"></div>
            <span>My Insta</span>
        </div>
    </div>

    <div class="post">
        <div class="post-header">
            <div class="post-user">
                <img src="https://picsum.photos/100/100?random=2" alt="Profile">
                <span class="username">My Instagram Account</span>
            </div>
            <i class="fas fa-ellipsis-h" style="font-size: 14px;"></i>
        </div>
        <div class="post-img">
            <img src="https://picsum.photos/600/700?random=3" alt="Post">
        </div>
        <div class="post-actions">
            <div>
                <i class="far fa-heart" id="likeBtn" onclick="handleLike()"></i>
                <i class="far fa-comment"></i>
                <i class="far fa-paper-plane"></i>
            </div>
            <i class="far fa-bookmark"></i>
        </div>
        <div class="likes"><span id="likeCount">1,240</span> likes</div>
        <div class="caption"><span>My Instagram Account</span> Permanent System Buniyaad</div>
    </div>

    <div class="bottom-nav">
        <i class="fas fa-home"></i>
        <i class="fas fa-search"></i>
        <i class="far fa-plus-square"></i>
        <i class="fas fa-film"></i>
        <i class="far fa-user-circle"></i>
    </div>
</div>

<script>
    // Permanent Data Storage Logic (Buniyaad)
    let isLiked = localStorage.getItem('post1_liked') === 'true';
    let count = parseInt(localStorage.getItem('post1_likes')) || 1240;

    const likeBtn = document.getElementById('likeBtn');
    const likeCount = document.getElementById('likeCount');

    function updateUI() {
        likeCount.innerText = count.toLocaleString();
        if(isLiked) {
            likeBtn.classList.remove('far');
            likeBtn.classList.add('fas', 'active');
        } else {
            likeBtn.classList.remove('fas', 'active');
            likeBtn.classList.add('far');
        }
    }

    function handleLike() {
        if(isLiked) {
            count--;
            isLiked = false;
        } else {
            count++;
            isLiked = true;
        }
        localStorage.setItem('post1_likes', count);
        localStorage.setItem('post1_liked', isLiked);
        updateUI();
    }

    updateUI();
</script>

</body>
</html>
